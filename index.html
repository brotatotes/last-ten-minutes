html,body{margin:0;height:100%;background:#06080c;color:#e9dcc0;font-family:"EB Garamond",Garamond,Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.ended #bar,body.ended #title,body.ended #hint,body.ended #stack,body.ended #nbbtn,body.ended #ansbtn{visibility:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#title{position:fixed;left:18px;top:10px;pointer-events:none;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8)}
#title h1{margin:0;font-style:italic;font-weight:400;font-size:clamp(22px,3.2vw,38px)}
#clock{font-size:clamp(17px,2vw,22px);opacity:.8}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(4,5,8,.95),rgba(4,5,8,.8) 60%,rgba(4,5,8,0));display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-size:18px;color:#e9dcc0;background:rgba(40,46,58,.85);border:1px solid rgba(233,220,192,.35);border-radius:8px;padding:6px 12px;min-width:44px;min-height:40px;cursor:pointer}
button:focus-visible{outline:2px solid #e8a64e}
#play{min-width:78px}
#time{width:100%;accent-color:#b3261e;height:28px;margin:0}
#ticks{display:flex;justify-content:space-between;font-size:15px;opacity:.86;padding:0 2px}
#stack{position:fixed;left:50%;transform:translateX(-50%);top:12px;width:min(92vw,560px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:2}
#follow{box-sizing:border-box;max-width:100%;background:rgba(10,12,18,.82);border:1px solid rgba(233,220,192,.3);border-radius:10px;padding:8px 14px;text-align:center;display:none;font-size:18px}
#follow b{font-weight:600}
#hint{position:fixed;right:16px;top:14px;font-size:15px;opacity:.78;text-align:right;pointer-events:none;max-width:40vw}
#speech{box-sizing:border-box;max-width:100%;background:rgba(233,220,192,.93);color:#1a1510;border-radius:10px;padding:8px 14px;font-size:19px;font-style:italic;display:none;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.5)}
#speech b{font-style:normal;font-weight:600}
#toast{box-sizing:border-box;background:rgba(10,12,18,.9);border:1px solid rgba(232,166,78,.6);border-radius:8px;padding:6px 12px;font-size:17px;display:none;max-width:90vw;text-align:center;pointer-events:none}
#nbbtn{position:fixed;right:14px;top:62px}
#notebook{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.72);z-index:5}
#notebook .nbcard{box-sizing:border-box;width:min(94vw,560px);max-height:calc(100vh - 170px);display:flex;flex-direction:column;background:#12161f;border:1px solid rgba(233,220,192,.35);border-radius:12px;padding:14px 16px}
#notebook .nbhead{display:flex;justify-content:space-between;align-items:center}
#notebook h2{margin:0;font-style:italic;font-weight:400;font-size:26px}
#nblist{font-variant-numeric:lining-nums;overflow-y:auto;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);padding-bottom:24px;margin-top:8px;-webkit-user-select:text;user-select:text}
#nblist .entry{border-top:1px solid rgba(233,220,192,.18);padding:8px 0;font-size:18px;line-height:1.35}
#nblist .eh{font-weight:400;color:#e8c98e;margin-bottom:3px}
#nblist .goto{font-variant-numeric:lining-nums;font-size:16px;min-height:34px;padding:3px 10px;margin-top:6px}
#nbcount{font-size:15px;opacity:.7}
#nblist .empty{opacity:.75;font-size:18px}
#ansbtn{position:fixed;right:14px;top:110px}
#ansbtn.locked{opacity:.55;cursor:default}
#answers .aset.locked h3{opacity:.7}
#answers .lockednote{font-style:italic;opacity:.8;margin:4px 0 6px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.86);z-index:6}
.modal .card{box-sizing:border-box;width:min(94vw,680px);max-height:calc(100vh - 40px);overflow-y:auto;background:#12161f;border:1px solid rgba(233,220,192,.35);border-radius:12px;padding:18px 20px;font-size:19px;line-height:1.4}
.modal h2{margin:0 0 8px;font-style:italic;font-weight:400;font-size:27px}
.modal h3{margin:14px 0 6px;font-weight:600;font-size:19px}
.modal p{margin:0 0 10px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
button.primary{background:rgba(120,36,30,.9);border-color:rgba(232,166,78,.6)}
#intro ul.cast{margin:0;padding-left:18px;font-size:17px}
#intro ul.cast li{margin:2px 0}
#answers .card{display:flex;flex-direction:column;overflow:hidden;padding:14px 16px;font-variant-numeric:lining-nums}
#answers .ahead{display:flex;justify-content:space-between;align-items:center}
#answers .ahead h2{margin:0}
#answers .note{font-size:16px;opacity:.8;margin:4px 0 6px}
#answers .abody{overflow-y:auto;padding-right:4px;padding-top:18px;padding-bottom:22px;-webkit-mask-image:linear-gradient(to bottom,transparent,transparent 4px,#000 26px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,transparent,transparent 4px,#000 26px,#000 calc(100% - 26px),transparent)}
#answers .aset{border-top:1px solid rgba(233,220,192,.2);padding:6px 0 10px}
#answers .aset.solved h3::after{content:" \00b7  solved";color:#8fd49a;font-weight:400;font-style:italic}
#answers .aset.solved select{border-color:#6fb07a;color:#bfe8c5}
#answers .q{margin:8px 0 10px}
#answers .sent{line-height:2.1}
#answers .nw{white-space:nowrap}
#answers .nw select{margin-right:0}
#answers select:disabled{opacity:1}
#answers .qn{font-weight:400;color:#e8c98e;margin-right:2px}

const BYID = {}; PEOPLE.forEach(p => BYID[p.id] = p);

// ---------- pure helpers ----------
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function segIndex(route,t){let i=0;while(i<route.length-1&&t>=route[i+1][0]) i++;return i;}
function interval(list,t){for(const iv of list) if(t>=iv[0]&&t<iv[1]) return iv;return null;}
function stepValue(list,t){let v=list[0][1];for(const [a,val] of list) if(t>=a) v=val;return v;}
function pos(id,t){const r=BYID[id].route;t=clamp(t,0,600);if(t<r[0][0]) return [r[0][1],r[0][2]];const i=segIndex(r,t);
  if(i>=r.length-1) return [r[i][1],r[i][2]];const a=r[i],b=r[i+1],u=clamp((t-a[0])/(b[0]-a[0]),0,1);return [a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}
function moving(id,t){const r=BYID[id].route;const i=segIndex(r,t);if(i>=r.length-1||t<r[0][0]) return null;const a=r[i],b=r[i+1];
  return (a[1]!==b[1]||a[2]!==b[2])?[b[1]-a[1],b[2]-a[2]]:null;}
function action(id,t){const r=BYID[id].route;if(t<r[0][0]) return r[0][3];return r[segIndex(r,t)][3];}

// ---------- station clock ----------
// Mr. Dunn pushes the hands forward two minutes with the hooked pole, starting at 9:53:10 (t = 190).
const CLOCK_SET = {start:190, end:196, minutes:2};
function stationOffset(t){if(t<=CLOCK_SET.start) return 0;if(t>=CLOCK_SET.end) return CLOCK_SET.minutes*60;
  return CLOCK_SET.minutes*60*(t-CLOCK_SET.start)/(CLOCK_SET.end-CLOCK_SET.start);}
function stationSeconds(t){return t+stationOffset(t);} // seconds after 9:50:00 shown by the station clock
function hm(sec){const m=50+Math.floor(sec/60);return m>=60?`10:${String(m-60).padStart(2,'0')}`:`9:${String(m).padStart(2,'0')}`;}
function hms(sec){const s=Math.floor(sec+1e-6);const m=50+Math.floor(s/60),x=s%60;return (m>=60?`10:${String(m-60).padStart(2,'0')}`:`9:${String(m).padStart(2,'0')}`)+':'+String(x).padStart(2,'0');}

function lerp2(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}
function trolley(t){const T1=PLACES.T1,T2=PLACES.T2;
  if(t<205) return T1.slice();if(t<262) return lerp2(T1,T2,(t-205)/57);
  if(t<455) return T2.slice();if(t<490) return lerp2(T2,T1,(t-455)/35);return T1.slice();}
function slot(k,tr){return k===1?[tr[0]+0.5,tr[1]+0.45]:k===2?[tr[0]+1.22,tr[1]+0.45]:[tr[0]+1.45,tr[1]+0.2];}

function caseState(cid,t){const tr=trolley(t);
  const on=(k)=>{const s=slot(k,tr);return {where:'trolley',slot:k,x:s[0],y:s[1]};};
  const hand=(who)=>{const p=pos(who,t);return {where:'hand',holder:who,x:p[0]+0.35,y:p[1]+0.1};};

    if(t<516) return on(1);

function greenLamp(t){return t>=536?{where:'hand',holder:'dunn',raised:t>=585}:{where:'hidden'};}

<script>
// The Last Ten Minutes: overheard lines, clickable clues and the notebook.

    case 'tin':{const q=S.lunchTin(t);return [q.x,q.y,PZ+0.45];}
    case 'pole':{const pl=S.pole(t);if(pl.where==='leaning') return [pl.x-0.07,pl.y-0.05,PZ+1.6];if(pl.where==='hand'){const p=S.pos('dunn',t);return [p[0]+0.3,p[1]-0.3,PZ+2.6];}return null;}

    case 'streetdoor':return [3.2,LTM.HALL.y1,PZ+0.9];
    case 'frontdoor':return t<590?[13.92,3.56,1.55]:null;
    case 'blind':return t<590?[5.3,3.56,1.85]:null;
    case 'glove':{const gv=S.glove(t);return gv.where==='ground'?[gv.x,gv.y,PZ+0.05]:null;}
  }
  return null;
}

function showSpeech(st){const lines=S.overheard(st.follow,st.t);const key=lines.map(l=>l.id).join('|');
  for(const L of lines) add({id:'heard:'+L.id,kind:'heard',title:'Overheard',text:speakerName(L)+': \u201c'+L.text+'\u201d',t:L.from},true);
  if(key===lastSpeech) return;lastSpeech=key;speechEl.innerHTML='';
  if(!lines.length){speechEl.style.display='none';return;}
  for(const L of lines){const d=document.createElement('div');const b=document.createElement('b');b.textContent=speakerName(L)+': ';d.appendChild(b);d.appendChild(document.createTextNode('\u201c'+L.text+'\u201d'));speechEl.appendChild(d);}
  speechEl.style.display='block';}
const prevAfter=window.LTM_afterDraw;
window.LTM_afterDraw=st=>{if(prevAfter) prevAfter(st);showSpeech(st);};

// ---------- drawing: a faint glint on things worth a closer look, and the rear-carriage blind ----------
const prevActors=window.LTM_actors;
window.LTM_actors=(t,api)=>{const items=prevActors?prevActors(t,api):[];
  if(t>=S.BLIND_DOWN-4&&t<590){const u=Math.min(1,(t-(S.BLIND_DOWN-4))/4);items.push({depth:8.8,draw:()=>{const z0=0.55;A.yq(4.95,5.65,3.552,z0+1.75-0.95*u,z0+1.75,'#6a4a32');}});}
  items.push({depth:1e6,draw:()=>{const g=A.g;if(document.body.classList.contains('finale')) return;
    for(const c of S.CLUES){if(has(c.id)||!S.clueActive(c,t)||c.target.startsWith('person:')) continue;const w=targetPoint(c.target,t);if(!w) continue;
      const [x,y]=A.P(w[0],w[1],w[2]);const pulse=0.5+0.5*Math.sin(t*2.2+x*0.01);
      A.glow(x,y,10+4*pulse,'255,236,190',0.28);g.strokeStyle=`rgba(255,240,205,${0.25+0.2*pulse})`;g.lineWidth=1;g.beginPath();g.arc(x,y,4.5,0,7);g.stroke();}}});
  return items;};

// ---------- the notebook panel ----------
const nbEl=document.getElementById('notebook'),nbBtn=document.getElementById('nbbtn'),nbList=document.getElementById('nblist');
function renderNotebook(){nbBtn.textContent='Notebook ('+notebook.length+')';nbList.innerHTML='';
  const cnt=document.getElementById('nbcount');if(cnt) cnt.textContent=notebook.length>3?notebook.length+' notes \u00b7 scroll for more':notebook.length+(notebook.length===1?' note':' notes');
  if(!notebook.length){const p=document.createElement('p');p.className='empty';p.textContent='Nothing yet. Tap things that catch your eye, and follow people to overhear them.';nbList.appendChild(p);return;}
  const sorted=notebook.slice().sort((a,b)=>a.t-b.t);
  for(const e of sorted){const d=document.createElement('div');d.className='entry';const h=document.createElement('div');h.className='eh';h.textContent=S.hms(e.t)+' \u00b7 '+e.title;
    const p=document.createElement('div');p.textContent=e.text;const go=document.createElement('button');go.className='goto';go.textContent='Go to '+S.hms(e.t);go.addEventListener('click',()=>{window.LTM_app.setT(e.t);closeNotebook();});
    d.appendChild(h);d.appendChild(p);d.appendChild(go);nbList.appendChild(d);}}
function openNotebook(){renderNotebook();nbEl.style.display='flex';nbEl.querySelector('#nbclose').focus({focusVisible:false});}
function closeNotebook(){nbEl.style.display='none';}
nbBtn.addEventListener('click',()=>{nbEl.style.display==='flex'?closeNotebook():openNotebook();});
document.getElementById('nbclose').addEventListener('click',closeNotebook);
renderNotebook();
window.LTM_notebook={entries:notebook,open:openNotebook,close:closeNotebook,targetPoint,screenOf,clear:()=>{notebook.length=0;save();renderNotebook();}};
})();

</script>
<script>
// The Last Ten Minutes: the opening card, the 10:00 card, the answer screen with hints, and the ending.
// Answers are checked against salted hashes in story.js. The game only ever says how many in a set are right.
'use strict';
(function(){
const S=STORY;
const $=id=>document.getElementById(id);
const introEl=$('intro'),tenEl=$('endcard'),ansEl=$('answers'),ansBtn=$('ansbtn'),finEl=$('finale');
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// In-memory only. Choices, revealed hints and solved sets survive scrubbing and closing the panel.
// watched: the questions stay closed until true time has reached 10:00 once, so they cannot spoil the first watch.
const state={choices:{},hints:{},solved:{1:false,2:false},checks:{1:0,2:0},hintsUsed:0,ended:false,watched:false};
for(const q of S.QUESTIONS){state.choices[q.id]=q.blanks.map(()=> '');state.hints[q.id]=0;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls) e.className=cls;if(text!==undefined) e.textContent=text;return e;}
function pause(){if(window.LTM_app) window.LTM_app.setPlaying(false);}

// ---------- opening card ----------
function openIntro(){introEl.innerHTML='';const card=el('div','card');card.appendChild(el('h2','',S.INTRO.title));
  for(const line of S.INTRO.lines) card.appendChild(el('p','',line));
  card.appendChild(el('h3','','Who\u2019s who'));const ul=el('ul','cast');
  for(const [name,desc] of S.CAST){const li=el('li');li.appendChild(el('b','',name+'. '));li.appendChild(document.createTextNode(desc));ul.appendChild(li);}
  card.appendChild(ul);
  const row=el('div','row');const go=el('button','primary','Begin');go.id='begin';go.addEventListener('click',closeIntro);row.appendChild(go);card.appendChild(row);
  introEl.appendChild(card);introEl.style.display='flex';go.focus({focusVisible:false});}
function closeIntro(){introEl.style.display='none';}

// ---------- the 10:00 card ----------
let tenShown=false;
function openTen(){tenShown=true;tenEl.innerHTML='';const card=el('div','card');
  card.appendChild(el('h2','','10:00 p.m. The train has gone.'));
  const solvedN=(state.solved[1]?1:0)+(state.solved[2]?1:0);
  card.appendChild(el('p','',solvedN===0?'Evelyn is nowhere to be seen. Do you know what happened? You can answer now, or go back and keep looking.':'You have solved '+solvedN+' of the two sets. Go back and keep looking, or try the rest.'));
  const row=el('div','row');
  const a=el('button','primary','Answer the questions');a.id='toanswers';a.addEventListener('click',()=>{closeTen();openAnswers();});
  const r=el('button','','Watch again from 9:50');r.id='replay';r.addEventListener('click',()=>{closeTen();window.LTM_app.setT(0);});
  const c=el('button','','Keep looking');c.id='closeend';c.addEventListener('click',closeTen);
  row.appendChild(a);row.appendChild(r);row.appendChild(c);card.appendChild(row);
  tenEl.appendChild(card);tenEl.style.display='flex';a.focus({focusVisible:false});}
function closeTen(){tenEl.style.display='none';}
function setWatched(){if(state.watched) return;state.watched=true;{const t=document.getElementById('toast');if(t&&/10:00 first/.test(t.textContent)) t.style.display='none';}ansBtn.classList.remove('locked');ansBtn.setAttribute('aria-label','Answer the questions');ansBtn.title='';}
ansBtn.classList.add('locked');ansBtn.setAttribute('aria-label','Answer the questions, opens after you reach 10:00');ansBtn.title='Watch through to 10:00 first';
window.LTM_onTime=t=>{if(t>=600) setWatched();if(t>=600&&!tenShown&&!state.ended&&ansEl.style.display!=='flex') openTen();if(t<599) tenShown=false;};

// ---------- answer panel ----------
const SET_TITLES={1:'First three: what you can see',2:'Last three: putting it together'};
function renderAnswers(){ansEl.innerHTML='';const card=el('div','card');
  const head=el('div','ahead');head.appendChild(el('h2','','Your answers'));const close=el('button','','Close');close.id='ansclose';close.addEventListener('click',closeAnswers);head.appendChild(close);card.appendChild(head);
  card.appendChild(el('p','note','Fill in every blank in a set, then check it. You\u2019ll be told how many of the three are right, not which ones.'));
  const body=el('div','abody');
  for(const setNo of [1,2]){const sec=el('section','aset'+(state.solved[setNo]?' solved':''));sec.dataset.set=setNo;
    sec.appendChild(el('h3','',SET_TITLES[setNo]));
    if(setNo===2&&!state.solved[1]){sec.classList.add('locked');sec.appendChild(el('p','lockednote','Solve the first three to open these.'));body.appendChild(sec);continue;}
    for(const q of S.QUESTIONS.filter(q=>q.set===setNo)){const qd=el('div','q');qd.dataset.q=q.id;
      const n=el('span','qn',q.id.slice(1)+'.');const sent=el('div','sent');sent.appendChild(n);
      let carry=null; // a select waiting to be glued to following punctuation so it never wraps alone
      q.parts.forEach((part,i)=>{if(part){const tight=/^[\u2019.,]/.test(part);let rest=part;
          if(tight&&carry){const m=part.match(/^\S+/);carry.appendChild(document.createTextNode(m[0]));rest=part.slice(m[0].length);}
          if(rest) sent.appendChild(document.createTextNode((tight?'':' ')+rest.replace(/^\s+/,tight?' ':'')+(i<q.blanks.length?' ':'')));
          else if(i<q.blanks.length) sent.appendChild(document.createTextNode(' '));}
        carry=null;
        if(i<q.blanks.length){const sel=el('select');sel.dataset.q=q.id;sel.dataset.i=i;sel.setAttribute('aria-label','Question '+q.id.slice(1)+', blank '+(i+1));
          sel.appendChild(new Option('\u2026',''));for(const o of q.blanks[i]) sel.appendChild(new Option(o,o));
          sel.value=state.choices[q.id][i];sel.disabled=state.solved[setNo];
          sel.addEventListener('change',()=>{state.choices[q.id][i]=sel.value;const st=sec.querySelector('.status');if(st&&!state.solved[setNo]) st.textContent='';});
          const nw=el('span','nw');nw.appendChild(sel);sent.appendChild(nw);carry=nw;}});
      qd.appendChild(sent);
      const hrow=el('div','hrow');const shown=state.hints[q.id];
      const hl=el('ol','hints');for(let k=0;k<shown;k++) hl.appendChild(el('li','',q.hints[k]));
      if(!state.solved[setNo]&&shown<q.hints.length){const hb=el('button','hint',shown===0?'Hint':'Another hint ('+(shown+1)+' of '+q.hints.length+')');hb.dataset.q=q.id;
        hb.addEventListener('click',()=>{state.hints[q.id]=Math.min(q.hints.length,state.hints[q.id]+1);state.hintsUsed++;renderAnswers();const b=ansEl.querySelector('.q[data-q="'+q.id+'"] .hint');(b||ansEl.querySelector('.q[data-q="'+q.id+'"] select')).focus({focusVisible:false});});
        hrow.appendChild(hb);}
      if(shown) qd.appendChild(hl);
      qd.appendChild(hrow);sec.appendChild(qd);}
    const foot=el('div','afoot');
    if(!state.solved[setNo]){const cb=el('button','primary','Check these three');cb.className='primary check';cb.dataset.set=setNo;cb.addEventListener('click',()=>check(setNo));foot.appendChild(cb);}
    const st=el('div','status');st.setAttribute('aria-live','polite');st.dataset.set=setNo;if(state.solved[setNo]) st.textContent='All three right. Well spotted.';foot.appendChild(st);
    sec.appendChild(foot);body.appendChild(sec);}
  const again=el('button','linkish','Read the case again');again.addEventListener('click',()=>{closeAnswers();openIntro();});body.appendChild(again);
  card.appendChild(body);ansEl.appendChild(card);}
function check(setNo){const st=ansEl.querySelector('.status[data-set="'+setNo+'"]');
  const qs=S.QUESTIONS.filter(q=>q.set===setNo);
  if(qs.some(q=>state.choices[q.id].some(v=>!v))){st.textContent='Fill in every blank in this set first.';return null;}
  state.checks[setNo]++;const r=S.checkSet(setNo,state.choices);
  if(r.solved){state.solved[setNo]=true;renderAnswers();
    if(state.solved[1]&&state.solved[2]){setTimeout(playEnding,reduced?300:1400);const s2=ansEl.querySelector('.status[data-set="'+setNo+'"]');if(s2) s2.textContent='All three right. You\u2019ve solved it.';}
    const cb=ansEl.querySelector('.aset[data-set="'+setNo+'"]');if(cb) cb.scrollIntoView({block:'nearest'});
    return r;}
  st.textContent=r.right===0?'None of the three are right yet. Keep looking.':(r.right===1?'1 of 3 is right.':'2 of 3 are right.')+' Keep looking.';
  return r;}
function openAnswers(){if(!state.watched){showLocked();return;}{const t=document.getElementById('toast');if(t&&/10:00 first/.test(t.textContent)) t.style.display='none';}pause();closeTen();if(window.LTM_notebook) window.LTM_notebook.close();renderAnswers();ansEl.style.display='flex';const f=ansEl.querySelector('select:not([disabled])')||$('ansclose');f.focus({focusVisible:false});}
function closeAnswers(){ansEl.style.display='none';}
function showLocked(){const t=document.getElementById('toast');if(!t) return;t.textContent='Watch through to 10:00 first. Then the questions open.';t.style.display='block';clearTimeout(showLocked.timer);showLocked.timer=setTimeout(()=>{t.style.display='none';},2600);}
ansBtn.addEventListener('click',()=>{ansEl.style.display==='flex'?closeAnswers():openAnswers();});

// ---------- ending scene ----------
// The camera settles on the street corner, Evelyn's umbrella turns it, and the train's lights fade behind.
let raf=null;
function playEnding(){if(state.ended) return;state.ended=true;closeAnswers();closeTen();closeIntro();pause();
  const app=window.LTM_app,st=app.state;st.follow=null;if(window.LTM_follow) window.LTM_follow(null);
  document.body.classList.add('ended','finale');
  st.cam.x=2.6;st.cam.y=10.0;st.cam.zoom=app.clampZoom(2.2);st.dirty=true;
  finEl.innerHTML='';const shade=el('div','shade');finEl.appendChild(shade);const txt=el('div','ftext');
  S.ENDING.lines.forEach((l,i)=>{const p=el('p','',l);p.style.transitionDelay=(reduced?0:1.2+i*2.2)+'s';txt.appendChild(p);});
  const row=el('div','row');const again=el('button','','Watch again from 9:50');again.id='playagain';again.addEventListener('click',endFinale);row.appendChild(again);
  row.style.transitionDelay=(reduced?0:5.6)+'s';txt.appendChild(row);finEl.appendChild(txt);finEl.style.display='block';
  const T0=531,T1=548.6,DUR=reduced?0:9000;let start=null;
  function tick(ts){if(start===null) start=ts;const u=DUR?Math.min(1,(ts-start)/DUR):1;app.setT(T0+(T1-T0)*u);{const e=S.pos('evelyn',st.t);const nar=st.W<700;st.cam.x=e[0]+(nar?0.4:1.3);st.cam.y=e[1]-(nar?0.5:0.9);}st.dirty=true;
    shade.style.opacity=String(0.15+0.7*u);if(u<1) raf=requestAnimationFrame(tick);else{raf=null;finEl.classList.add('done');}}
  raf=requestAnimationFrame(tick);requestAnimationFrame(()=>finEl.classList.add('show'));}
function endFinale(){if(raf) cancelAnimationFrame(raf);raf=null;finEl.style.display='none';finEl.className='';document.body.classList.remove('ended','finale');state.ended=false;tenShown=false;
  const app=window.LTM_app;app.state.cam.zoom=app.clampZoom(1.6);app.setT(0);}
function escape(){if(state.ended) return true;
  for(const [e,f] of [[ansEl,closeAnswers],[tenEl,closeTen],[introEl,closeIntro]]) if(e.style.display==='flex'){f();return true;}
  return false;}

window.LTM_answers={state,setWatched,openIntro,closeIntro,openTen,closeTen,open:openAnswers,close:closeAnswers,check,playEnding,endFinale,escape};
openIntro();
})();

</script>
<script>
// The Last Ten Minutes: app shell (time, controls, camera).
'use strict';
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
const slider=document.getElementById('time'),clockEl=document.getElementById('clock');
const playBtn=document.getElementById('play'),speedBtn=document.getElementById('speed');
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={t:0,playing:false,speed:4,cam:{x:11,y:7.4,zoom:1.6},target:null,follow:null,lastFrame:null,dirty:true};
window.LTM_STATE=state;
// Playback rates: 1× plays the ten minutes in 2.5 minutes, ¼× is real time for careful watching.
const SPEEDS=[4,16,1];
const SPEED_LABEL={4:'1×',16:'4×',1:'¼×'};
function size(){const dpr=Math.min(window.devicePixelRatio||1,2);const W=cv.clientWidth,H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);state.W=W;state.H=H;state.dpr=dpr;
  state.cam.zoom=clampZoom(state.cam.zoom);
  const bar=document.getElementById('bar');state.cam.oy=bar?Math.round(bar.getBoundingClientRect().height*(H<500?0.75:0.45)):0;state.dirty=true;}
function clampZoom(z){const base=Math.min(state.W||800,(state.H||600)*1.6)/900;return Math.max(0.6*base+0.3,Math.min(3,z));}
function clampCam(){const c=state.cam;c.x=Math.max(1,Math.min(21,c.x));c.y=Math.max(1.5,Math.min(11,c.y));}
function setT(t,fromSlider){state.t=Math.max(0,Math.min(LTM.T_END,Math.round(t*1000)/1000));if(!fromSlider) slider.value=String(state.t);state.dirty=true;
  if(state.t>=LTM.T_END&&state.playing){setPlaying(false);}
  if(window.LTM_onTime) window.LTM_onTime(state.t);}
function setPlaying(p){state.playing=p;playBtn.textContent=p?'Pause':'Play';playBtn.setAttribute('aria-pressed',p?'true':'false');state.lastFrame=null;if(p&&state.t>=LTM.T_END) setT(0);}
function cycleSpeed(){state.speed=SPEEDS[(SPEEDS.indexOf(state.speed)+1)%SPEEDS.length];speedBtn.textContent=SPEED_LABEL[state.speed];}
function step(d){setT(state.t+d);}
function draw(){
  LTM.render(ctx,{t:state.t,width:state.W,height:state.H,dpr:state.dpr,camera:state.cam,reduced,actors:window.LTM_actors||null,clerkIn:window.LTM_clerkIn?window.LTM_clerkIn(state.t):true});
  clockEl.textContent=LTM.clockText(state.t)+' p.m.';
  slider.setAttribute('aria-valuetext',LTM.clockText(state.t));
  if(window.LTM_afterDraw) window.LTM_afterDraw(state);
  state.dirty=false;
}
function frame(ts){
  if(state.playing){if(state.lastFrame!==null){const dt=Math.min(0.1,(ts-state.lastFrame)/1000);setT(state.t+dt*state.speed);}state.lastFrame=ts;}
  if(state.follow&&window.LTM_positionOf){const p=window.LTM_positionOf(state.follow,state.t);if(p){const c=state.cam;if(reduced){c.x=p[0];c.y=p[1];}else{c.x+=(p[0]-c.x)*0.15;c.y+=(p[1]-c.y)*0.15;}clampCam();state.dirty=true;}}
  if(state.dirty) draw();
  requestAnimationFrame(frame);
}
// controls
slider.addEventListener('input',()=>setT(parseFloat(slider.value),true));
playBtn.addEventListener('click',()=>setPlaying(!state.playing));
speedBtn.addEventListener('click',cycleSpeed);
document.getElementById('back').addEventListener('click',()=>step(-5));
document.getElementById('fwd').addEventListener('click',()=>step(5));
document.getElementById('zin').addEventListener('click',()=>{state.cam.zoom=clampZoom(state.cam.zoom*1.25);state.dirty=true;});
document.getElementById('zout').addEventListener('click',()=>{state.cam.zoom=clampZoom(state.cam.zoom/1.25);state.dirty=true;});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  const big=e.shiftKey?30:5;
  if(e.key===' '){e.preventDefault();setPlaying(!state.playing);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-big);}
  else if(e.key==='ArrowRight'){e.preventDefault();step(big);}
  else if(e.key===','){step(-1);}else if(e.key==='.'){step(1);}
  else if(e.key==='+'||e.key==='='){state.cam.zoom=clampZoom(state.cam.zoom*1.25);state.dirty=true;}
  else if(e.key==='-'){state.cam.zoom=clampZoom(state.cam.zoom/1.25);state.dirty=true;}
  else if(e.key==='s'||e.key==='S'){cycleSpeed();}
  else if(window.LTM_onKey) window.LTM_onKey(e);
});
// pan + pinch with pointer events (mouse and touch)
const ptrs=new Map();let drag=null,pinch=null,moved=0;
function screenToWorldDelta(dx,dy){const z=state.cam.zoom*LTM.API.S;// inverse of iso projection at fixed z
  const a=dx/(z*LTM.API.C30),b=dy/(z*LTM.API.S30);return [(a+b)/2,(b-a)/2];}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,cx:state.cam.x,cy:state.cam.y};
  if(ptrs.size===2){const p=[...ptrs.values()];pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),z:state.cam.zoom};drag=null;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)) return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const p=[...ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);state.cam.zoom=clampZoom(pinch.z*d/pinch.d);state.dirty=true;moved=99;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>6){const [wx,wy]=screenToWorldDelta(dx,dy);state.cam.x=drag.cx-wx;state.cam.y=drag.cy-wy;clampCam();state.follow=null;if(window.LTM_onFollow) window.LTM_onFollow(null);state.dirty=true;}}});
function up(e){const wasTap=ptrs.size===1&&moved<=6&&!pinch;ptrs.delete(e.pointerId);if(ptrs.size<2) pinch=null;if(ptrs.size===0) drag=null;
  if(wasTap&&window.LTM_onTap){const r=cv.getBoundingClientRect();window.LTM_onTap(e.clientX-r.left,e.clientY-r.top);}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();state.cam.zoom=clampZoom(state.cam.zoom*(e.deltaY<0?1.1:1/1.1));state.dirty=true;},{passive:false});
window.addEventListener('resize',size);
// test hooks
window.LTM_app={setT,setPlaying,step,cycleSpeed,state,draw,clampZoom};
size();setT(0);
Promise.resolve(document.fonts&&document.fonts.ready).then(()=>{state.dirty=true;document.body.dataset.ready='1';});
requestAnimationFrame(frame);
})();

</script>
