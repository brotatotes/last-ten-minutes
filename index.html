html,body{margin:0;height:100%;background:#06080c;color:#e9dcc0;font-family:"EB Garamond",Garamond,Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.ended #bar,body.ended #title,body.ended #hint,body.ended #follow{visibility:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#title{position:fixed;left:18px;top:10px;pointer-events:none;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8)}
#title h1{margin:0;font-style:italic;font-weight:400;font-size:clamp(22px,3.2vw,38px)}
#clock{font-size:clamp(17px,2vw,22px);opacity:.8}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(4,5,8,.92),rgba(4,5,8,.55) 70%,rgba(4,5,8,0));display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-size:18px;color:#e9dcc0;background:rgba(40,46,58,.85);border:1px solid rgba(233,220,192,.35);border-radius:8px;padding:6px 12px;min-width:44px;min-height:40px;cursor:pointer}
button:focus-visible{outline:2px solid #e8a64e}
#play{min-width:78px}
#time{width:100%;accent-color:#b3261e;height:28px;margin:0}
#ticks{display:flex;justify-content:space-between;font-size:15px;opacity:.7;padding:0 2px}
#follow{position:fixed;left:50%;transform:translateX(-50%);top:12px;max-width:min(92vw,560px);background:rgba(10,12,18,.82);border:1px solid rgba(233,220,192,.3);border-radius:10px;padding:8px 14px;text-align:center;display:none;font-size:18px}
#follow b{font-weight:600}
#hint{position:fixed;right:16px;top:14px;font-size:15px;opacity:.6;text-align:right;pointer-events:none;max-width:40vw}
#endcard{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.72)}
#endcard .card{box-sizing:border-box;max-height:92vh;overflow-y:auto;margin:0 12px;background:#12161f;border:1px solid rgba(233,220,192,.35);border-radius:12px;padding:20px 22px;max-width:min(92vw,520px);font-size:19px}
#endcard h2{margin:0 0 10px;font-style:italic;font-weight:400;font-size:26px}
#endcard .opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#endcard .opts button{text-align:left}
@media (max-width:600px){#hint{display:none}#follow{top:auto;bottom:130px}button{font-size:17px;padding:6px 10px}}
@media (max-height:450px){#hint{display:none}#title h1{font-size:20px}#bar{padding:4px 10px}#ticks{display:none}#follow{top:8px;font-size:16px}}

<body>
<canvas id="scene" aria-label="The station platform"></canvas>
<div id="title"><h1>The Last Ten Minutes</h1><div id="clock">9:50:00 p.m.</div></div>
<div id="hint">Drag to look around. Tap a person to follow them.<br>Space plays, arrows step.</div>
<div id="follow" role="status" aria-live="polite"></div>
<div id="bar">
  <input id="time" type="range" min="0" max="600" step="0.1" value="0" aria-label="Time from 9:50 to 10:00 p.m.">
  <div id="ticks"><span>9:50</span><span>9:52</span><span>9:54</span><span>9:56</span><span>9:58</span><span>10:00</span></div>
  <div id="row">
    <button id="back" aria-label="Back five seconds">−5s</button>
    <button id="play" aria-pressed="false">Play</button>
    <button id="fwd" aria-label="Forward five seconds">+5s</button>
    <button id="speed" aria-label="Playback speed">1×</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zin" aria-label="Zoom in">+</button>
  </div>
</div>
<div id="endcard" role="dialog" aria-modal="true"></div>
<script>
// The Last Ten Minutes: scene renderer. Pure function of (t, camera, viewport).
// Derived from the approved mood study (mood/mood.html).
'use strict';
const LTM = (function(){
const S=44,C30=0.8660254,S30=0.5,PZ=0.7,T_END=600;
let g=null;
function P(x,y,z=0){return [(x-y)*C30*S,(x+y)*S30*S - z*S];}
function poly(pts,fill,stroke){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}}
function box(x0,x1,y0,y1,z0,z1,top,left,right,edge){
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],left,edge);
  poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],right,edge);
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],top,edge);
}
function yq(x0,x1,yy,z0,z1,fill){poly([P(x0,yy,z0),P(x1,yy,z0),P(x1,yy,z1),P(x0,yy,z1)],fill);}
function xq(xx,y0,y1,z0,z1,fill){poly([P(xx,y0,z0),P(xx,y1,z0),P(xx,y1,z1),P(xx,y0,z1)],fill);}
function glow(x,y,r,col,a){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(0.35,`rgba(${col},${a*0.35})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);g.restore();}
function pool(wx,wy,wz,r,col,a){const [x,y]=P(wx,wy,wz);g.save();g.globalCompositeOperation='lighter';g.translate(x,y);g.scale(1,0.55);const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(0.5,`rgba(${col},${a*0.35})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore();}
// Deterministic hash noise: h(i,k) in [0,1)
function h(i,k){let x=(i*374761393+k*668265263)|0;x=(x^(x>>>13))*1274126177|0;x=x^(x>>>16);return (x>>>0)/4294967296;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function smooth(e0,e1,v){const u=clamp((v-e0)/(e1-e0),0,1);return u*u*(3-2*u);}

// ---------- world layout ----------
const WORLD={x0:0,x1:22,y0:0,y1:11.5};
const LAMPS=[[6.4,10.4],[12.3,10.4],[18.0,10.4],[8.2,5.1],[15.4,5.1]];
const CLOCK=[11.0,7.4];
const BENCH=[8.2,8.6];
const HALL={x0:0.4,x1:4.6,y0:4.9,y1:10.6};

// ---------- static pieces ----------
function drawSlab(){
  box(0,22,0,11.5,-1.3,0,'#1a1d22','#2a2019','#1f1813');
  for(const [z,col] of [[-0.25,'#3a2c20'],[-0.55,'#241a13'],[-0.9,'#30241a']]){g.strokeStyle=col;g.lineWidth=2;g.beginPath();let a=P(0,11.5,z),b=P(22,11.5,z),d=P(22,0,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(d[0],d[1]);g.stroke();}
  const [px,py]=P(8.2,11.5,-0.25);g.save();g.transform(C30,S30,0,1,px,py);
  let pg=g.createLinearGradient(0,0,0,34);pg.addColorStop(0,'#8a6a34');pg.addColorStop(1,'#5a4220');g.fillStyle=pg;g.fillRect(0,0,330,36);g.strokeStyle='#b8924c';g.lineWidth=1.5;g.strokeRect(3,3,324,30);
  g.fillStyle='#2a1c0c';g.font='italic 22px "EB Garamond", Garamond, Georgia, serif';g.textAlign='center';g.fillText('Ashcombe Halt',165,25);g.restore();
}
function drawTrack(){
  box(0,22,0.6,4.1,0,0.18,'#23252a','#1c1d21','#18191c');
  for(let x=0.3;x<22;x+=0.75) box(x,x+0.28,0.9,3.8,0.18,0.26,'#2e2620','#221c17','#1d1813');
  for(const y of [1.55,3.0]) box(0,22,y,y+0.12,0.26,0.36,'#7d8590','#4b5058','#3a3e44');
}
function drawPlatform(t){
  box(0,22,4.2,11.2,0,PZ,'#2b323d','#2f343b','#262a30','#1b1e23');
  g.strokeStyle='rgba(15,18,24,0.55)';g.lineWidth=1;
  for(let x=1;x<22;x+=1){const a=P(x,4.6,PZ),b=P(x,11.2,PZ);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
  for(let y=5.6;y<11.2;y+=1){const a=P(0,y,PZ),b=P(22,y,PZ);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
  box(0,22,4.2,4.6,PZ,PZ+0.02,'#4a4f57','#3b3f45','#33363b');
  poly([P(0,4.62,PZ),P(22,4.62,PZ),P(22,4.78,PZ),P(0,4.78,PZ)],'#8a7a3a');
  for(let z=0.18;z<PZ;z+=0.2){g.strokeStyle='rgba(10,12,16,0.5)';const a=P(0,11.2,z),b=P(22,11.2,z),d=P(22,4.2,z);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(d[0],d[1]);g.stroke();}
  // puddles (static positions)
  for(let i=0;i<16;i++){const x=5+h(i,1)*16,y=5.2+h(i,2)*5.6;const [a,b]=P(x,y,PZ);g.fillStyle='rgba(120,150,190,0.09)';g.beginPath();g.ellipse(a,b,22+h(i,3)*34,6+h(i,4)*6,0,0,7);g.fill();}

// ---------- steam ----------
function drawSteam(t){
  // continuous plume: puffs are born every 0.5 s and age deterministically
  const rate=2, life=14, depart=smooth(575,600,t);

  for(let n=nNow-life*rate;n<=nNow;n++){
    if(n<-life*rate) continue;
    const age=t-n/rate; if(age<0||age>life) continue;
    const u=age/life, jx=h(n,11)-0.5, jz=h(n,12);
    const [a,b]=P(20.2-u*9-jx*0.8,2.2+jx*1.2,3.7+u*1.8+jz*0.8);
    const r=20+u*80+h(n,13)*20;const al=(0.11+0.08*depart)*(1-u)*(u<0.05?u/0.05:1);
    const gr=g.createRadialGradient(a,b,0,a,b,r);gr.addColorStop(0,`rgba(205,210,220,${al})`);gr.addColorStop(1,'rgba(205,210,220,0)');g.fillStyle=gr;g.fillRect(a-r,b-r,2*r,2*r);
  }
  // low drifting steam along the train, heavier near departure
  for(let i=0;i<30;i++){const drift=((h(i,21)*17+t*0.05*(0.5+h(i,22)))%17);const [a,b]=P(3+drift,4.1,0.4+h(i,23)*0.5);const r=30+h(i,24)*40;const al=0.06+0.08*depart;const gr=g.createRadialGradient(a,b,0,a,b,r);gr.addColorStop(0,`rgba(200,205,215,${al})`);gr.addColorStop(1,'rgba(200,205,215,0)');g.fillStyle=gr;g.fillRect(a-r,b-r,2*r,2*r);}
}

    const hh=c.look.h*st.cam.zoom;const cy=b-hh*0.55;const d=Math.hypot((sx-a)/Math.max(18,c.look.w*st.cam.zoom),(sy-cy)/(hh*0.7));if(d<bd){bd=d;best=c;}}
  follow(best&&bd<1.6?best.id:null);};
window.LTM_onKey=e=>{const st=window.LTM_STATE;if(e.key==='f'||e.key==='F'){const vis=CHARS.filter(c=>visible(c,st.t));if(!vis.length) return;const i=vis.findIndex(c=>c.id===st.follow);follow(vis[(i+1)%vis.length].id);}
  else if(e.key==='Escape'){if(document.getElementById('endcard').style.display==='flex') closeEnd();else follow(null);}};

// ---- end question
const endEl=document.getElementById('endcard');let endShown=false;
const OPTIONS=[['nothing','Nothing out of the ordinary'],['swap','Swapped the two cases, so her case went into the other carriage'],['lost','Left one of the cases behind on the platform'],['harrow','Gave both cases to the man in the grey hat']];
function openEnd(){endShown=true;endEl.innerHTML='';const card=document.createElement('div');card.className='card';
  const h2=document.createElement('h2');h2.textContent='10:00 p.m. The train has gone.';card.appendChild(h2);
  const q=document.createElement('div');q.textContent='What did the porter do with the luggage?';card.appendChild(q);
  const opts=document.createElement('div');opts.className='opts';for(const [k,label] of OPTIONS){const bt=document.createElement('button');bt.textContent=label;bt.dataset.answer=k;bt.addEventListener('click',()=>answer(k));opts.appendChild(bt);}card.appendChild(opts);
  const fb=document.createElement('div');fb.id='feedback';fb.setAttribute('aria-live','polite');card.appendChild(fb);
  const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center';
  const rb=document.createElement('button');rb.textContent='Watch again from 9:50';rb.id='replay';rb.addEventListener('click',()=>{closeEnd();window.LTM_app.setT(0);});
  const cb=document.createElement('button');cb.textContent='Keep looking';cb.id='closeend';cb.addEventListener('click',closeEnd);row.appendChild(rb);row.appendChild(cb);card.appendChild(row);
  endEl.appendChild(card);endEl.style.display='flex';document.body.classList.add('ended');opts.querySelector('button').focus({focusVisible:false});}
function closeEnd(){endEl.style.display='none';document.body.classList.remove('ended');}
function answer(k){const fb=document.getElementById('feedback');
  fb.textContent=k==='swap'?'Yes. Her red-strapped case went into the rear carriage with Mr. Harrow, and his went with her. Now, was it an accident?'
   :'Not quite. Try watching the porter and his trolley between 9:56 and 9:57.';}
window.LTM_onTime=t=>{if(t>=600&&!endShown) openEnd();if(t<599) endShown=false;};
window.LTM_end={openEnd,closeEnd,answer};
})();

</script>
<script>
// The Last Ten Minutes: app shell (time, controls, camera).
'use strict';
(function(){
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
const slider=document.getElementById('time'),clockEl=document.getElementById('clock');
const playBtn=document.getElementById('play'),speedBtn=document.getElementById('speed');
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={t:0,playing:false,speed:4,cam:{x:11,y:7.4,zoom:1.6},target:null,follow:null,lastFrame:null,dirty:true};
window.LTM_STATE=state;
// Playback rates: 1× plays the ten minutes in 2.5 minutes, ¼× is real time for careful watching.
const SPEEDS=[4,16,1];
const SPEED_LABEL={4:'1×',16:'4×',1:'¼×'};
function size(){const dpr=Math.min(window.devicePixelRatio||1,2);const W=cv.clientWidth,H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);state.W=W;state.H=H;state.dpr=dpr;
  state.cam.zoom=clampZoom(state.cam.zoom);
  const bar=document.getElementById('bar');state.cam.oy=bar?Math.round(bar.getBoundingClientRect().height*(H<500?0.75:0.45)):0;state.dirty=true;}
function clampZoom(z){const base=Math.min(state.W||800,(state.H||600)*1.6)/900;return Math.max(0.6*base+0.3,Math.min(3,z));}
function clampCam(){const c=state.cam;c.x=Math.max(1,Math.min(21,c.x));c.y=Math.max(1.5,Math.min(11,c.y));}
function setT(t,fromSlider){state.t=Math.max(0,Math.min(LTM.T_END,Math.round(t*1000)/1000));if(!fromSlider) slider.value=String(state.t);state.dirty=true;
  if(state.t>=LTM.T_END&&state.playing){setPlaying(false);}
  if(window.LTM_onTime) window.LTM_onTime(state.t);}
function setPlaying(p){state.playing=p;playBtn.textContent=p?'Pause':'Play';playBtn.setAttribute('aria-pressed',p?'true':'false');state.lastFrame=null;if(p&&state.t>=LTM.T_END) setT(0);}
function cycleSpeed(){state.speed=SPEEDS[(SPEEDS.indexOf(state.speed)+1)%SPEEDS.length];speedBtn.textContent=SPEED_LABEL[state.speed];}
function step(d){setT(state.t+d);}
function draw(){
  LTM.render(ctx,{t:state.t,width:state.W,height:state.H,dpr:state.dpr,camera:state.cam,reduced,actors:window.LTM_actors||null,clerkIn:window.LTM_clerkIn?window.LTM_clerkIn(state.t):true});
  clockEl.textContent=LTM.clockText(state.t)+' p.m.';
  slider.setAttribute('aria-valuetext',LTM.clockText(state.t));
  if(window.LTM_afterDraw) window.LTM_afterDraw(state);
  state.dirty=false;
}
function frame(ts){
  if(state.playing){if(state.lastFrame!==null){const dt=Math.min(0.1,(ts-state.lastFrame)/1000);setT(state.t+dt*state.speed);}state.lastFrame=ts;}
  if(state.follow&&window.LTM_positionOf){const p=window.LTM_positionOf(state.follow,state.t);if(p){const c=state.cam;if(reduced){c.x=p[0];c.y=p[1];}else{c.x+=(p[0]-c.x)*0.15;c.y+=(p[1]-c.y)*0.15;}clampCam();state.dirty=true;}}
  if(state.dirty) draw();
  requestAnimationFrame(frame);
}
// controls
slider.addEventListener('input',()=>setT(parseFloat(slider.value),true));
playBtn.addEventListener('click',()=>setPlaying(!state.playing));
speedBtn.addEventListener('click',cycleSpeed);
document.getElementById('back').addEventListener('click',()=>step(-5));
document.getElementById('fwd').addEventListener('click',()=>step(5));
document.getElementById('zin').addEventListener('click',()=>{state.cam.zoom=clampZoom(state.cam.zoom*1.25);state.dirty=true;});
document.getElementById('zout').addEventListener('click',()=>{state.cam.zoom=clampZoom(state.cam.zoom/1.25);state.dirty=true;});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  const big=e.shiftKey?30:5;
  if(e.key===' '){e.preventDefault();setPlaying(!state.playing);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-big);}
  else if(e.key==='ArrowRight'){e.preventDefault();step(big);}
  else if(e.key===','){step(-1);}else if(e.key==='.'){step(1);}
  else if(e.key==='+'||e.key==='='){state.cam.zoom=clampZoom(state.cam.zoom*1.25);state.dirty=true;}
  else if(e.key==='-'){state.cam.zoom=clampZoom(state.cam.zoom/1.25);state.dirty=true;}
  else if(e.key==='s'||e.key==='S'){cycleSpeed();}
  else if(window.LTM_onKey) window.LTM_onKey(e);
});
// pan + pinch with pointer events (mouse and touch)
const ptrs=new Map();let drag=null,pinch=null,moved=0;
function screenToWorldDelta(dx,dy){const z=state.cam.zoom*LTM.API.S;// inverse of iso projection at fixed z
  const a=dx/(z*LTM.API.C30),b=dy/(z*LTM.API.S30);return [(a+b)/2,(b-a)/2];}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,cx:state.cam.x,cy:state.cam.y};
  if(ptrs.size===2){const p=[...ptrs.values()];pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),z:state.cam.zoom};drag=null;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)) return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const p=[...ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);state.cam.zoom=clampZoom(pinch.z*d/pinch.d);state.dirty=true;moved=99;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>6){const [wx,wy]=screenToWorldDelta(dx,dy);state.cam.x=drag.cx-wx;state.cam.y=drag.cy-wy;clampCam();state.follow=null;if(window.LTM_onFollow) window.LTM_onFollow(null);state.dirty=true;}}});
function up(e){const wasTap=ptrs.size===1&&moved<=6&&!pinch;ptrs.delete(e.pointerId);if(ptrs.size<2) pinch=null;if(ptrs.size===0) drag=null;
  if(wasTap&&window.LTM_onTap){const r=cv.getBoundingClientRect();window.LTM_onTap(e.clientX-r.left,e.clientY-r.top);}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();state.cam.zoom=clampZoom(state.cam.zoom*(e.deltaY<0?1.1:1/1.1));state.dirty=true;},{passive:false});
window.addEventListener('resize',size);
// test hooks
window.LTM_app={setT,setPlaying,step,cycleSpeed,state,draw,clampZoom};
size();setT(0);
Promise.resolve(document.fonts&&document.fonts.ready).then(()=>{state.dirty=true;document.body.dataset.ready='1';});
requestAnimationFrame(frame);
})();

</script>
